<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>m1cd App - By Muhamad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0d131f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .top-bar {
      background: #161f30;
      border: 1px solid #243049;
      border-radius: 50px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .handle { color: #1da1f2; font-weight: 700; font-size: 16px; direction: ltr; }
    .social-icons { display: flex; gap: 12px; align-items: center; }
    .social-icons svg { width: 20px; height: 20px; fill: #e2e8f0; }

    .logo-box {
      width: 84px;
      height: 84px;
      background: #ffffff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .logo-inner {
      width: 56px;
      height: 56px;
      background: #090d16;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-inner svg { width: 30px; height: 30px; fill: #0ea5e9; }

    h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    .badges { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
    .badge {
      background: #161f30;
      border: 1px solid #243049;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 13px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #131b2b;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 20px;
    }

    .input-group {
      display: flex;
      background: #0b101b;
      border: 1px solid #26334d;
      border-radius: 14px;
      padding: 6px;
      margin-bottom: 16px;
      align-items: center;
    }
    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      direction: ltr;
    }
    .paste-btn {
      background: #172554;
      color: #38bdf8;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .format-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .format-btn {
      background: #0b101b;
      border: 1.5px solid #243049;
      border-radius: 14px;
      padding: 16px 10px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 700;
      font-size: 14px;
    }
    .format-btn.active {
      background: #0c233a;
      border-color: #0ea5e9;
      color: #ffffff;
    }
    .format-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .format-btn.active svg { fill: #0ea5e9; }

    .download-btn {
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(14, 165, 233, 0.35);
    }
    .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      min-height: 20px;
    }
    .error { color: #f87171; }
    .success { color: #34d399; }
    .loading { color: #38bdf8; }

    .result-box {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .direct-link {
      display: block;
      text-align: center;
      background: #10b981;
      color: #06281e;
      font-weight: 800;
      padding: 13px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
    }

    footer {
      margin-top: auto;
      padding-top: 28px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="handle">@m1c_d</span>
    <div class="social-icons">
      <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2c-3.1 0-5.4 2.2-5.4 5.3 0 .8.2 1.7.4 2.4-.3.2-.8.3-1.2.3-.5 0-.9.3-.9.8 0 .6.6 1 1.4 1.2.2.1.3.3.2.5-.5 1.4-1.7 2.6-3.3 3.2-.5.2-.7.6-.6 1.1.2.6 1.1 1 2.5 1.2.2.1.3.4.4.8.1.4.4.7.9.7.4 0 .9-.2 1.5-.2.9 0 1.8.6 3.1.6s2.2-.6 3.1-.6c.6 0 1.1.2 1.5.2.5 0 .8-.3.9-.7.1-.4.2-.7.4-.8 1.4-.2 2.3-.6 2.5-1.2.1-.5-.1-.9-.6-1.1-1.6-.6-2.8-1.8-3.3-3.2-.1-.2 0-.4.2-.5.8-.2 1.4-.6 1.4-1.2 0-.5-.4-.8-.9-.8-.4 0-.9-.1-1.2-.3.2-.7.4-1.6.4-2.4C17.4 4.2 15.1 2 12 2z"/></svg>
    </div>
  </div>

  <div class="logo-box">
    <div class="logo-inner">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </div>
  </div>

  <h1>By Muhamad</h1>
  <p class="subtitle">داگرتنی ڤیدیۆ و دەنگ بە خێرایی و کوالێتی بەرز</p>

  <div class="badges">
    <div class="badge">تیک تۆک</div>
    <div class="badge">ئینستاگرام</div>
    <div class="badge">یوتیوب</div>
  </div>

  <div class="card">
    <div class="input-group">
      <button class="paste-btn" onclick="pasteLink()">لکاندن</button>
      <input type="url" id="urlInput" placeholder="لینکەکە لێرە دابنێ..." />
    </div>

    <div class="format-grid">
      <button class="format-btn active" id="btnVideo" onclick="selectFormat('video')">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        ڤیدیۆ (MP4)
      </button>
      <button class="format-btn" id="btnAudio" onclick="selectFormat('audio')">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        دەنگ (MP3)
      </button>
    </div>

    <button class="download-btn" id="dlBtn" onclick="startDownload()">
      داگرتن ئێستا
    </button>

    <div class="status" id="statusText"></div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <footer>m1cd App © 2026 - هەموو مافەکان پارێزراون</footer>

  <script>
    // ==========================================
    const RAPID_API_KEY = "529f719083mshcc7a5142a6a5c56p117a25jsn599170200c21";
    // ==========================================

    let selectedFormat = 'video';

    function selectFormat(type) {
      selectedFormat = type;
      document.getElementById('btnVideo').classList.toggle('active', type === 'video');
      document.getElementById('btnAudio').classList.toggle('active', type === 'audio');
    }

    async function pasteLink() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
      } catch (e) {
        alert("تکایە لینکەکە بە دەست Paste بکە");
      }
    }

    function normalizeUrl(rawUrl) {
      let clean = rawUrl.trim();
      if (clean.includes("youtube.com/shorts/")) {
        const id = clean.split("shorts/")[1].split("?")[0].split("/")[0];
        clean = `https://www.youtube.com/watch?v=${id}`;
      }
      return clean;
    }

    async function startDownload() {
      const rawUrl = document.getElementById('urlInput').value;
      const status = document.getElementById('statusText');
      const resultBox = document.getElementById('resultBox');
      const dlBtn = document.getElementById('dlBtn');

      if (!rawUrl || !rawUrl.startsWith('http')) {
        status.className = 'status error';
        status.innerText = 'تکایە لینکێکی دروست دابنێ!';
        return;
      }

      const targetUrl = normalizeUrl(rawUrl);
      dlBtn.disabled = true;
      resultBox.style.display = 'none';
      resultBox.innerHTML = '';
      status.className = 'status loading';
      status.innerText = 'چاوەڕێ بە، لینکەکە ئامادە دەکرێت...';

      try {
        let mediaUrl = null;

        if (RAPID_API_KEY && RAPID_API_KEY !== "YOUR_RAPIDAPI_KEY_HERE") {
          const res = await fetch("https://social-download-all-in-one.p.rapidapi.com/v1/social/autolink", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "X-RapidAPI-Key": RAPID_API_KEY,
              "X-RapidAPI-Host": "social-download-all-in-one.p.rapidapi.com"
            },
            body: JSON.stringify({ url: targetUrl })
          });

          const data = await res.json();
          if (data && data.medias && data.medias.length > 0) {
            if (selectedFormat === 'audio') {
              const audio = data.medias.find(m => m.type === 'audio' || m.extension === 'mp3' || m.extension === 'm4a');
              mediaUrl = audio ? audio.url : data.medias[0].url;
            } else {
              const video = data.medias.find(m => m.type === 'video' && m.quality !== 'no_watermark') || data.medias.find(m => m.type === 'video');
              mediaUrl = video ? video.url : data.medias[0].url;
            }
          }
        }

        if (!mediaUrl && targetUrl.includes("tiktok.com")) {
          const tkRes = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(targetUrl)}`);
          const tkData = await tkRes.json();
          if (tkData && tkData.data) {
            mediaUrl = selectedFormat === 'audio' ? tkData.data.music : tkData.data.play;
          }
        }

        if (mediaUrl) {
          status.className = 'status success';
          status.innerText = 'لینکەکە ئامادەیە! کلیک لە دوگمەی خوارەوە بکە بۆ داگرتن:';
          resultBox.innerHTML = `<a href="${mediaUrl}" target="_blank" download class="direct-link">⬇️ داگرتنی فایل (${selectedFormat.toUpperCase()})</a>`;
          resultBox.style.display = 'flex';
        } else {
          throw new Error("No media found");
        }

      } catch (err) {
        status.className = 'status error';
        status.innerText = 'سێرڤەر نەیتوانی لینکەکە بهێنێت. دڵنیابە لە گشتی بوونی (Public) لینکەکە یان دووبارە هەوڵبدەرەوە.';
      } finally {
        dlBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
