<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>m1cd - داگرتنی ڤیدیۆ و دەنگ</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23ffffff'/%3E%3Ccircle cx='256' cy='256' r='175' fill='%23000000'/%3E%3Cpath d='M256 165v125m0 0l-50-50m50 50l50-50M180 335h152' stroke='%230088ff' stroke-width='32' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: #131620;
            --accent-blue: #0088ff;
            --accent-glow: rgba(0, 136, 255, 0.35);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #212636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Arabic', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background-image: radial-gradient(circle at top center, #131c31 0%, #090a0f 65%);
        }

        .top-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .social-bar {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 10px 22px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .social-icons {
            display: flex;
            gap: 14px;
            font-size: 1.2rem;
        }

        .social-icons a {
            color: var(--text-main);
            transition: transform 0.2s, color 0.2s;
        }

        .social-icons a.snap:hover { color: #FFFC00; }
        .social-icons a.tele:hover { color: #26A5E4; }
        .social-icons a.tiktok:hover { color: #ff0050; }

        .username-badge {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
            border-right: 1px solid var(--border-color);
            padding-right: 14px;
            direction: ltr;
        }

        .center-brand {
            text-align: center;
            margin: 25px 0;
        }

        .app-logo-preview {
            width: 82px;
            height: 82px;
            margin: 0 auto 15px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .brand-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffffff, #a5c9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            direction: ltr;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .platforms-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .platforms-badges span {
            background: var(--card-bg);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .downloader-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 22px 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            background: #0b0d14;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 15px 15px 15px 75px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .input-group input::placeholder {
            text-align: right;
            direction: rtl;
            font-family: 'Noto Sans Arabic', sans-serif;
            color: #5c6475;
        }

        .paste-btn {
            position: absolute;
            left: 8px;
            background: rgba(0, 136, 255, 0.15);
            color: var(--accent-blue);
            border: none;
            padding: 8px 12px;
            border-radius: 11px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .paste-btn:active {
            transform: scale(0.95);
        }

        .format-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .format-option {
            background: #0b0d14;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .format-option i {
            font-size: 1.3rem;
            color: var(--text-muted);
            transition: 0.25s;
        }

        .format-option span {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .format-option.active {
            border-color: var(--accent-blue);
            background: rgba(0, 136, 255, 0.12);
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.15);
        }

        .format-option.active i,
        .format-option.active span {
            color: #ffffff;
        }

        .format-option.active i {
            color: var(--accent-blue);
        }

        .download-btn {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: transform 0.2s, background 0.2s;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn:disabled {
            background: #2b354b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-area {
            margin-top: 16px;
            text-align: center;
            font-size: 0.88rem;
            min-height: 24px;
            line-height: 1.5;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            display: none;
            margin-top: 16px;
            background: #0b0d14;
            border: 1px solid #1f3a2e;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }

        .save-file-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 8px;
            width: 100%;
        }

        .footer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="social-bar">
            <div class="social-icons">
                <a href="https://www.snapchat.com/add/m1c_d" target="_blank" class="snap" title="Snapchat"><i class="fa-brands fa-snapchat"></i></a>
                <a href="https://t.me/m1c_d" target="_blank" class="tele" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://www.tiktok.com/@m1c_d" target="_blank" class="tiktok" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            </div>
            <div class="username-badge">@m1c_d</div>
        </div>
    </header>

    <main>
        <div class="center-brand">
            <div class="app-logo-preview">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
                    <rect width="512" height="512" fill="#ffffff"/>
                    <circle cx="256" cy="256" r="180" fill="#000000"/>
                    <path d="M256 160v130m0 0l-52-52m52 52l52-52M175 340h162" stroke="#0088ff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>
            <h1 class="brand-title">By Muhamad</h1>
            <p class="brand-subtitle">داگرتنی ڤیدیۆ و دەنگ بە خێرایی و کوالێتی بەرز</p>

            <div class="platforms-badges">
                <span><i class="fa-brands fa-tiktok"></i> تیک تۆک</span>
                <span><i class="fa-brands fa-instagram"></i> ئینستاگرام</span>
                <span><i class="fa-brands fa-youtube"></i> یوتیوب</span>
            </div>
        </div>

        <div class="downloader-box">
            <div class="input-group">
                <input type="url" id="videoUrl" placeholder="لینکی ڤیدیۆکە لێرە دابنێ..." autocomplete="off">
                <button type="button" class="paste-btn" onclick="pasteLink()">لکاندن</button>
            </div>

            <div class="format-selector">
                <div class="format-option active" id="opt-video" onclick="selectFormat('video')">
                    <i class="fa-solid fa-video"></i>
                    <span>ڤیدیۆ (MP4)</span>
                </div>
                <div class="format-option" id="opt-audio" onclick="selectFormat('audio')">
                    <i class="fa-solid fa-music"></i>
                    <span>دەنگ (MP3)</span>
                </div>
            </div>

            <button type="button" class="download-btn" id="downloadBtn" onclick="startDownload()">
                <i class="fa-solid fa-download"></i>
                <span>داگرتن ئێستا</span>
            </button>

            <div class="status-area">
                <div class="loader" id="loader"></div>
                <p id="statusText"></p>
            </div>

            <div class="result-card" id="resultCard">
                <p style="color: #10b981; font-size: 0.85rem; font-weight: 600;">فایلەکە ئامادەیە بۆ پاشەکەوتکردن!</p>
                <a href="#" id="finalDownloadLink" class="save-file-btn" download>
                    <i class="fa-solid fa-folder-arrow-down"></i>
                    <span>پاشەکەوتکردن لە ناو مۆبایل</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>m1cd App &copy; 2026 - هەموو مافەکان پارێزراون</p>
    </footer>

    <script>
        let selectedFormat = 'video';

        // گۆڕینی جۆری داگرتن (ڤیدیۆ یان دەنگ)
        function selectFormat(format) {
            selectedFormat = format;
            document.getElementById('opt-video').classList.toggle('active', format === 'video');
            document.getElementById('opt-audio').classList.toggle('active', format === 'audio');
        }

        // لکاندنی لینک لە کلیپبۆرد
        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('videoUrl').value = text.trim();
                    showStatus('لینکەکە لکێندرا.', '#10b981');
                }
            } catch (err) {
                showStatus('تکایە لینکەکە بە دەست دابنێ (Paste).', '#f59e0b');
            }
        }

        function showStatus(msg, color = '#8b949e') {
            const statusText = document.getElementById('statusText');
            statusText.style.color = color;
            statusText.innerText = msg;
        }

        function detectPlatform(url) {
            if (url.includes('tiktok.com')) return 'tiktok';
            if (url.includes('instagram.com')) return 'instagram';
            if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
            return null;
        }

        // هەوڵدان بۆ وەرگرتنی لینک لە چەند سەرچاوەیەک
        async function resolveDownloadUrl(url, platform, format) {
            // 1. TikTok API خێرا بۆ تیک تۆک
            if (platform === 'tiktok') {
                try {
                    const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.data) {
                            if (format === 'audio' && json.data.music) {
                                return json.data.music;
                            }
                            if (json.data.play) {
                                return json.data.play;
                            }
                        }
                    }
                } catch (_) {}
            }

            // 2. Cobalt API بۆ تیک تۆک، ئینستاگرام و یوتیوب
            const cobaltUrls = [
                'https://api.cobalt.tools/api/json',
                'https://api.cobalt.tools/'
            ];

            for (const apiUrl of cobaltUrls) {
                try {
                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url: url,
                            downloadMode: format === 'audio' ? 'audio' : 'auto',
                            isAudioOnly: format === 'audio',
                            audioFormat: 'mp3',
                            aFormat: 'mp3',
                            videoQuality: '720',
                            vQuality: '720'
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.url) return data.url;
                        if (data && Array.isArray(data.picker) && data.picker[0]?.url) {
                            return data.picker[0].url;
                        }
                    }
                } catch (_) {}
            }

            return null;
        }

        async function startDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const btn = document.getElementById('downloadBtn');
            const resultCard = document.getElementById('resultCard');

            resultCard.style.display = 'none';

            if (!urlInput) {
                showStatus('تکایە سەرەتا لینکی تیک تۆک، ئینستاگرام یان یوتیوب دابنێ!', '#ef4444');
                return;
            }

            const platform = detectPlatform(urlInput);
            if (!platform) {
                showStatus('تەنها لینکەکانی تیک تۆک، ئینستاگرام و یوتیوب پشتگیری دەکرێن.', '#ef4444');
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            showStatus('چاوەڕوان بە، خەریکی دۆزینەوەی فایلەکەین...', '#0088ff');

            const mediaUrl = await resolveDownloadUrl(urlInput, platform, selectedFormat);

            loader.style.display = 'none';
            btn.disabled = false;

            if (!mediaUrl) {
                showStatus(
                    'ئەم لینکە لە ئێستادا لە ڕێگەی سێرڤەرە گشتییەکانەوە نەهات. دڵنیابە لینکەکە گشتییە (Public) یان دووبارە هەوڵبدەرەوە.',
                    '#ef4444'
                );
                return;
            }

            const fileName = selectedFormat === 'audio'
                ? `m1cd_${platform}_audio.mp3`
                : `m1cd_${platform}_video.mp4`;

            const finalLink = document.getElementById('finalDownloadLink');
            finalLink.href = mediaUrl;
            finalLink.setAttribute('download', fileName);
            resultCard.style.display = 'block';
            showStatus('بە سەرکەوتوویی ئامادە کرا!', '#10b981');

            // هەوڵدان بۆ پاشەکەوتکردن بە شێوەی Blob ئەگەر ڕێگەپێدراو بێت، ئەگەرنا لینکە ڕاستەوخۆکە دەکرێتەوە
            try {
                const fileRes = await fetch(mediaUrl);
                if (fileRes.ok) {
                    const blob = await fileRes.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    finalLink.href = blobUrl;
                    finalLink.setAttribute('download', fileName);

                    const tempA = document.createElement('a');
                    tempA.href = blobUrl;
                    tempA.download = fileName;
                    document.body.appendChild(tempA);
                    tempA.click();
                    tempA.remove();
                    return;
                }
            } catch (_) {}

            window.location.href = mediaUrl;
        }
    </script>
</body>
</html>
